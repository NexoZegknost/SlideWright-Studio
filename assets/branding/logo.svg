<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 440 440" width="440" height="440">
  <title>SlideWright Studio</title>
  <defs>
    <linearGradient id="light-tile" x1="0.15" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#FFF9F3"/><stop offset="1" stop-color="#FFE8D6"/>
    </linearGradient>
    <linearGradient id="light-orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB067"/><stop offset="0.55" stop-color="#FF7F33"/><stop offset="1" stop-color="#F45D1F"/>
    </linearGradient>
    <linearGradient id="light-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFB067"/><stop offset="1" stop-color="#F45D1F"/>
    </linearGradient>
    <filter id="light-blob" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="light-frost" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="light-soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
    <clipPath id="light-tileclip"><rect width="440" height="440" rx="104"/></clipPath>
    <clipPath id="light-card"><rect x="136" y="162" width="216" height="160" rx="26"/></clipPath>
    <mask id="light-outside" maskUnits="userSpaceOnUse" x="0" y="0" width="440" height="440">
      <rect width="440" height="440" fill="#fff"/><rect x="136" y="162" width="216" height="160" rx="26" fill="#000"/>
    </mask>
  </defs>
  <g clip-path="url(#light-tileclip)">
    <g id="light-scene">
    <rect width="440" height="440" rx="104" fill="url(#light-tile)"/>
    <g filter="url(#light-blob)">
      <circle cx="65" cy="365" r="115" fill="#FFB067" opacity="0.5"/>
      <circle cx="375" cy="65" r="105" fill="#FFD0A3" opacity="0.75"/>
    </g>
      <g transform="rotate(-9 204 189)">
        <rect x="96" y="128" width="216" height="158" rx="26" fill="#F45D1F" opacity="0.30" filter="url(#light-soft)"/>
        <rect x="96" y="110" width="216" height="158" rx="26" fill="url(#light-orange)"/>
      </g>
    </g>
    <rect x="136" y="184" width="216" height="160" rx="26" fill="#D65A14" opacity="0.2"
          filter="url(#light-soft)" mask="url(#light-outside)"/>
    <g clip-path="url(#light-card)">
      <use href="#light-scene" xlink:href="#light-scene" filter="url(#light-frost)"/>
      <rect x="136" y="162" width="216" height="160" fill="#FFFFFF" opacity="0.38"/>
      <rect x="136" y="162" width="216" height="40" fill="#FFFFFF" opacity="0.10"/>
    </g>
    <rect x="136.75" y="162.75" width="214.5" height="158.5" rx="25.25" fill="none" stroke="#FFFFFF"
          stroke-opacity="0.8" stroke-width="1.5"/>
    <rect x="160" y="188" width="104" height="14" rx="7" fill="url(#light-bar)"/>
    <rect x="160" y="214" width="150" height="9" rx="4.5" fill="#E8621E" opacity="0.26"/>
    <rect x="160" y="235" width="98" height="9" rx="4.5" fill="#E8621E" opacity="0.26"/>
    <rect x="160" y="292" width="20" height="8" rx="4" fill="#F45D1F"/>
    <rect x="186" y="292" width="8" height="8" rx="4" fill="#E8621E" opacity="0.3"/>
    <rect x="200" y="292" width="8" height="8" rx="4" fill="#E8621E" opacity="0.3"/>
    <path d="M12 0C12.9 7 17 11.1 24 12C17 12.9 12.9 17 12 24C11.1 17 7 12.9 0 12C7 11.1 11.1 7 12 0Z" transform="translate(306 182) scale(1.0833)" fill="#F45D1F"/>
  </g>
  <rect x="0.5" y="0.5" width="439" height="439" rx="103.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.95"/>
</svg>
