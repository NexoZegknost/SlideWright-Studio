name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Bản chính thức (vX.Y.Z) phát hành từ main.
      # Bản thử (vX.Y.Z-beta.N, có dấu "-") phát hành từ nhánh chứa tag, không đụng tới main;
      # tag phải gắn đúng commit mới nhất của nhánh đó.
      - name: Chọn nhánh phát hành
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            *-*)
              BRANCH=$(git branch -r --contains "$GITHUB_SHA" --format='%(refname:lstrip=3)' \
                | grep -vE '^(HEAD|main)$' | head -1)
              if [ -z "$BRANCH" ]; then
                echo "::error::Tag thử $TAG phải gắn trên một nhánh khác main"; exit 1
              fi
              if [ "$(git rev-parse "origin/$BRANCH")" != "$GITHUB_SHA" ]; then
                echo "::error::Tag $TAG không trỏ vào commit mới nhất của nhánh $BRANCH"; exit 1
              fi ;;
            *) BRANCH=main ;;
          esac
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          git checkout -B "$BRANCH" "origin/$BRANCH"

      - name: Đồng bộ số phiên bản
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          # 1. plugin.json
          jq --arg v "$VERSION" '.version = $v' .claude-plugin/plugin.json > tmp.json
          mv tmp.json .claude-plugin/plugin.json

          # 1b. gemini-extension.json, package.json (bản Gemini CLI)
          for f in gemini-extension.json package.json; do
            jq --arg v "$VERSION" '.version = $v' "$f" > tmp.json
            mv tmp.json "$f"
          done

          # 2. README
          sed -i -E "s/(Phiên bản hiện tại: \*\*)[^*]+(\*\*)/\1$VERSION\2/" README.md

          # 3. CHANGELOG: nếu bạn chưa tự viết mục này thì sinh từ các commit
          if ! grep -q "^## $VERSION\$" CHANGELOG.md; then
            PREV=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
            RANGE="${PREV:+$PREV..}$TAG"
            { echo "## $VERSION"
              git log "$RANGE" --no-merges --pretty='- %s' | grep -v 'chore(release)'
              echo; } > section.md
            awk 'FNR==NR{s=s $0 "\n"; next} !d && /^## /{printf "%s", s; d=1} {print}' \
              section.md CHANGELOG.md > tmp.md
            mv tmp.md CHANGELOG.md
          fi

          # ghi chú phát hành = mục của phiên bản này
          awk -v v="## $VERSION" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md

      - name: Commit lại và dời tag về commit mới
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/plugin.json gemini-extension.json package.json README.md CHANGELOG.md
          git diff --cached --quiet || git commit -m "chore(release): $VERSION"
          git push origin "HEAD:$BRANCH"
          git tag -f "$TAG"
          git push -f origin "$TAG"

      - name: Đóng gói và phát hành
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip -r "slidewright-studio-$VERSION.plugin" . -x ".git/*" ".github/*" "*.patch" notes.md section.md \
            "dist/*" "gemini-app/*" "tools/*"
          # Gói cho Gemini app: mỗi skill một tệp .zip để tải lên (Skills → Create → Upload)
          python3 tools/build_gemini_app.py --ra dist
          FLAGS=""
          case "$VERSION" in *-*) FLAGS="--prerelease" ;; esac
          gh release create "v$VERSION" "slidewright-studio-$VERSION.plugin" dist/*.zip \
            --target "$BRANCH" \
            --title "SlideWright - Studio v$VERSION" \
            --notes-file notes.md $FLAGS